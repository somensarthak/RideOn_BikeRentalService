<svg width="240" height="65" viewBox="0 0 240 65" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Motorcycle & Sunset Emblem -->
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sunset Dome with Cutout -->
    <path d="M11 16C14 6.5 23 1 33 1C43 1 52 6.5 55 16H42C41.5 13.5 39.5 12 37 12C35 12 33.5 13.5 33 16H24.5C24 12.5 21 10 17.5 10C14 10 11.5 12.5 11 16Z" stroke="none" />

    <!-- Background Speed / Horizon Lines -->
    <line x1="10" y1="20" x2="31" y2="20" stroke-width="2" />
    <line x1="51" y1="20" x2="57" y2="20" stroke-width="2" />
    <line x1="10" y1="25" x2="23" y2="25" stroke-width="2" />
    <line x1="55" y1="25" x2="59" y2="25" stroke-width="2" />
    <line x1="56" y1="30" x2="59" y2="30" stroke-width="2" />

    <!-- Rear Fender & Seat -->
    <path d="M3 32C7 28 13 27 19 28.5L23 29.5" stroke-width="2.5" fill="none" />

    <!-- Fuel Tank -->
    <path d="M24.5 28C26 23 32 21.5 38.5 22.5C40.5 23 41.5 25 40.5 28H24.5Z" stroke="none" />
    <circle cx="37.5" cy="25" r="1.5" fill="#0B0F19" stroke="none" />

    <!-- Handlebar & Headlight -->
    <path d="M39.5 15.5H42.5L44.5 22L50.5 41" stroke-width="2.2" fill="none" />
    <path d="M46.5 21.5H50.5V26.5H46.5V21.5Z" stroke="none" />

    <!-- Frame & Engine Block -->
    <path d="M19 29.5L25 43H39L43.5 29.5" stroke-width="2" fill="none" />
    <line x1="26" y1="33" x2="37" y2="33" stroke-width="2" />
    <line x1="27" y1="36.5" x2="36" y2="36.5" stroke-width="2" />
    <line x1="28" y1="40" x2="35" y2="40" stroke-width="2" />

    <!-- Exhaust Pipe & Rear Swingarm -->
    <path d="M11 43L21 31" stroke-width="1.8" fill="none" />
    <path d="M12 46H38L41.5 42.5" stroke-width="2.2" fill="none" />

    <!-- Rear Wheel -->
    <circle cx="11" cy="43" r="8.5" stroke-width="3.2" fill="none" />
    <circle cx="11" cy="43" r="2" stroke-width="1.5" fill="none" />
    <line x1="11" y1="35" x2="11" y2="41" stroke-width="1.2" />
    <line x1="11" y1="45" x2="11" y2="51" stroke-width="1.2" />
    <line x1="3" y1="43" x2="9" y2="43" stroke-width="1.2" />
    <line x1="13" y1="43" x2="19" y2="43" stroke-width="1.2" />

    <!-- Front Wheel -->
    <circle cx="52" cy="43" r="8.5" stroke-width="3.2" fill="none" />
    <circle cx="52" cy="43" r="2" stroke-width="1.5" fill="none" />
    <line x1="52" y1="35" x2="52" y2="41" stroke-width="1.2" />
    <line x1="52" y1="45" x2="52" y2="51" stroke-width="1.2" />
    <line x1="44" y1="43" x2="50" y2="43" stroke-width="1.2" />
    <line x1="54" y1="43" x2="60" y2="43" stroke-width="1.2" />

    <!-- Road Reflection Lines Below -->
    <line x1="26" y1="53.5" x2="38" y2="53.5" stroke-width="1.8" />
    <line x1="14" y1="57.5" x2="51" y2="57.5" stroke-width="2" />
    <line x1="20" y1="60.5" x2="44" y2="60.5" stroke-width="1.8" />
    <line x1="27" y1="63.5" x2="39" y2="63.5" stroke-width="1.8" />
  </g>

  <!-- "Ride On" Brand Typography -->
  <text x="72" y="42" fill="#FFFFFF" font-family="&#39;Outfit&#39;, &#39;Inter&#39;, system-ui, -apple-system, sans-serif" font-weight="700" font-size="34" letter-spacing="-0.5">
    Ride On
  </text>
</svg>